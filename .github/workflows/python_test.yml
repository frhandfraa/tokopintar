# File: .github/workflows/python-tests.yml
name: TokoPintar CI (Unit Tests)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests
        # Jika ada requirements.txt, aktifkan baris di bawah:
        # pip install -r requirements.txt

    - name: 🚀 Run Tests
      run: |
        # Test ini akan mencoba memanggil localhost:5001. 
        # Karena di GitHub tidak ada service yang jalan, test akan di-skip jika API mati.
        pytest tests/test_ai.py -v