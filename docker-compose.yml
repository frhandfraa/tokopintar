version: "3.9"

services:
  db:
    image: postgres:16
    container_name: db_tokoonline
    environment:
      POSTGRES_USER: user123
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_tokoonline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tokopintar_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: