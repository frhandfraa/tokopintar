version: "3.9"

services:
  db:
    image: postgres:16
    container_name: tokopintar_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tokopintar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tokopintar_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: