<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - TokoPintar</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #03AC0E;
            --primary-hover: #028A0B;
            --seller-color: #E67E22;
            --seller-hover: #D35400;
            --text-dark: #212121;
            --text-muted: #6D7588;
            --border-line: #E5E7E9;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #FFFFFF;
            color: var(--text-dark);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* TOP NAVBAR GLASS ALA TOKOPEDIA */
        .top-navbar {
            padding: 16px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-line);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 20;
        }
        .navbar-brand-text {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            letter-spacing: -0.6px;
        }
        .navbar-brand-text i { color: var(--primary-color); }
        .help-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .help-link:hover { color: var(--primary-color); }

        .split-container {
            display: flex;
            min-height: 100vh;
            padding-top: 72px;
        }

        /* BANNER SIDE DENGAN SUPERGRAPHIC CIRCLES */
        .banner-side {
            flex: 1.15;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 48px;
            position: relative;
            overflow: hidden;
            transition: all 0.45s ease;
            min-height: calc(100vh - 72px);
        }
        .banner-side::before {
            content: '';
            position: absolute;
            width: 440px;
            height: 440px;
            border-radius: 50%;
            border: 52px solid rgba(255, 255, 255, 0.14);
            top: -150px;
            left: -130px;
            pointer-events: none;
        }
        .banner-side::after {
            content: '';
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            bottom: -100px;
            right: -70px;
            pointer-events: none;
        }

        .banner-side h1 {
            font-size: 2.35rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            z-index: 1;
        }
        .banner-side p {
            font-size: 1rem;
            max-width: 460px;
            line-height: 1.7;
            margin-bottom: 32px;
            z-index: 1;
        }
        .banner-illustration {
            width: 82%;
            max-width: 380px;
            height: 270px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #FFFFFF;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.14);
            z-index: 1;
            transition: 0.4s;
        }

        .theme-pembeli {
            background: linear-gradient(135deg, #007A0A 0%, #03AC0E 65%, #19C926 100%);
            color: #FFFFFF;
        }
        .theme-pembeli p { color: rgba(255, 255, 255, 0.92); }
        .theme-pembeli .banner-illustration {
            background-image: url('https://img.freepik.com/free-vector/ecommerce-web-page-concept-illustration_114360-8204.jpg');
        }

        .theme-pedagang {
            background: linear-gradient(135deg, #C0392B 0%, #E67E22 65%, #F39C12 100%);
            color: #FFFFFF;
        }
        .theme-pedagang p { color: rgba(255, 255, 255, 0.92); }
        .theme-pedagang .banner-illustration {
            background-image: url('https://img.freepik.com/free-vector/store-staff-checking-clipboard_23-2148645258.jpg');
        }

        /* FORM SIDE & ELEVATED CARD */
        .form-side {
            flex: 0.85;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            background: #FAFAFA;
            min-height: calc(100vh - 72px);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border: 1px solid var(--border-line);
            border-radius: 16px;
            padding: 34px 30px;
            box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.08);
        }

        .auth-tabs {
            display: flex;
            background: #F3F4F5;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.25s;
            color: var(--text-muted);
            border: none;
            background: transparent;
        }
        .auth-tab.active {
            background: #FFFFFF;
            color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .auth-tab.active.seller-active { color: var(--seller-color); }

        #formTitle {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .form-control {
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.92rem;
            border: 1.5px solid #D1D5DB;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(3, 172, 14, 0.12);
        }

        .btn-login {
            background-color: var(--primary-color);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.3px;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
            margin-top: 6px;
        }
        .btn-login:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-login.seller-btn { background-color: var(--seller-color); }
        .btn-login.seller-btn:hover:not(:disabled) { background-color: var(--seller-hover); }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-line);
        }
        .divider:not(:empty)::before { margin-right: 14px; }
        .divider:not(:empty)::after { margin-left: 14px; }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border-line);
            border-radius: 8px;
            background: #FFFFFF;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        .btn-social:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
        }

        .footer-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border-line);
        }
        .footer-text a {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
        }
        .footer-text a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .split-container { flex-direction: column; padding-top: 0; }
            .banner-side { display: none; }
            .form-side { min-height: calc(100vh - 68px); padding: 24px 16px; }
            .top-navbar { padding: 14px 20px; position: relative; }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <a href="/api/products/view" class="navbar-brand-text">
            <i class="bi bi-bag-heart-fill"></i> TokoPintar
        </a>
        <div>
            <a href="/api/products/about" class="help-link"><i class="bi bi-question-circle"></i> Butuh bantuan?</a>
        </div>
    </div>

    <div class="split-container">
        
        <div class="banner-side theme-pembeli" id="bannerSide">
            <h1 id="bannerTitle">Mulai Petualanganmu!</h1>
            <p id="bannerDesc">Daftar sekarang dan temukan produk impianmu dengan rekomendasi AI.</p>
            <div class="banner-illustration"></div>
        </div>

        <div class="form-side">
            <div class="login-card">
                
                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" id="tab-pembeli" onclick="switchMode('pembeli')">Pembeli</button>
                    <button type="button" class="auth-tab" id="tab-pedagang" onclick="switchMode('pedagang')">Pedagang</button>
                </div>

                <h2 class="fw-bold mb-1" id="formTitle">Daftar Akun</h2>
                <p class="text-muted mb-4" style="font-size: 0.85rem;" id="formDesc">Lengkapi data diri Anda untuk mulai berbelanja.</p>
                
                <div id="alert-box" class="alert alert-danger d-none rounded-3 py-2" style="font-size: 0.85rem;"></div>
                <div id="success-box" class="alert alert-success d-none rounded-3 py-2" style="font-size: 0.85rem;"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="name" placeholder="Nama Lengkap" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Email" required>
                    </div>
                    <div class="mb-3 position-relative">
                        <input type="password" class="form-control" id="password" placeholder="Password (min. 6 karakter)" required minlength="6">
                        <i class="bi bi-eye-slash position-absolute top-50 end-0 translate-middle-y me-3 text-muted" id="togglePassword" style="cursor: pointer;"></i>
                    </div>

                    <button type="submit" class="btn-login" id="btnRegister">DAFTAR</button>
                </form>

                <div class="divider">ATAU</div>

                <!-- TOMBOL FACEBOOK & GOOGLE OAUTH -->
                <button type="button" class="btn-social" onclick="registerWithSocial('facebook')">
                    <i class="bi bi-facebook text-primary fs-5"></i> Daftar dengan Facebook
                </button>
                <button type="button" class="btn-social" onclick="registerWithSocial('google')">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.3 0 6.08-1.09 8.1-2.96l-3.88-3.05c-1.1.74-2.51 1.18-4.22 1.18-3.25 0-6-2.19-6.98-5.14H1.01v3.14C3.05 21.2 7.24 24 12 24z"/><path fill="#FBBC05" d="M5.02 14.03c-.25-.74-.39-1.54-.39-2.36 0-.82.14-1.62.39-2.36V6.17H1.01C.37 7.45 0 8.88 0 10.37s.37 2.92 1.01 4.2l4.01-3.14z"/><path fill="#EA4335" d="M12 4.75c1.79 0 3.41.62 4.68 1.82l3.51-3.51C18.07 1.19 15.3 0 12 0 7.24 0 3.05 2.8 1.01 6.83l4.01 3.14c.98-2.95 3.73-5.22 6.98-5.22z"/></svg>
                    Daftar dengan Google
                </button>

                <div class="footer-text">
                    Sudah punya akun? <a href="/api/auth/view/login">Masuk Sekarang</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let registerMode = 'pembeli';

        function registerWithSocial(provider) {
            window.location.href = `/api/auth/${provider}/login?role=${registerMode}`;
        }

        function switchMode(mode) {
            registerMode = mode;
            const banner = document.getElementById('bannerSide');
            const tabPembeli = document.getElementById('tab-pembeli');
            const tabPedagang = document.getElementById('tab-pedagang');
            const btnRegister = document.getElementById('btnRegister');
            const formTitle = document.getElementById('formTitle');
            const formDesc = document.getElementById('formDesc');

            if (mode === 'pedagang') {
                banner.classList.remove('theme-pembeli');
                banner.classList.add('theme-pedagang');
                document.getElementById('bannerTitle').innerText = "Jadilah Penjual Terbaik!";
                document.getElementById('bannerDesc').innerText = "Buka toko Anda dan kelola penjualan dengan cerdas di TokoPintar.";
                
                tabPedagang.classList.add('active', 'seller-active');
                tabPembeli.classList.remove('active', 'seller-active');
                
                formTitle.innerText = "Daftar Akun Pedagang";
                formDesc.innerText = "Mulai bangun bisnis Anda hari ini.";
                btnRegister.innerText = "DAFTAR SEBAGAI PEDAGANG";
                btnRegister.classList.add('seller-btn');
            } else {
                banner.classList.remove('theme-pedagang');
                banner.classList.add('theme-pembeli');
                document.getElementById('bannerTitle').innerText = "Mulai Petualanganmu!";
                document.getElementById('bannerDesc').innerText = "Daftar sekarang dan temukan produk impianmu dengan rekomendasi AI.";
                
                tabPembeli.classList.add('active');
                tabPedagang.classList.remove('active', 'seller-active');
                
                formTitle.innerText = "Daftar Akun Pembeli";
                formDesc.innerText = "Lengkapi data diri Anda untuk mulai berbelanja.";
                btnRegister.innerText = "DAFTAR";
                btnRegister.classList.remove('seller-btn');
            }
            
            document.getElementById('alert-box').classList.add('d-none');
            document.getElementById('success-box').classList.add('d-none');
        }

        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('bi-eye');
            this.classList.toggle('bi-eye-slash');
        });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');
            const successBox = document.getElementById('success-box');
            const btnSubmit = document.getElementById('btnRegister');

            btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mengirim Kode OTP...';
            btnSubmit.disabled = true;
            alertBox.classList.add('d-none');
            successBox.classList.add('d-none');

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role: registerMode })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alertBox.innerText = data.error;
                    alertBox.classList.remove('d-none');
                    btnSubmit.innerHTML = registerMode === 'pedagang' ? 'DAFTAR SEBAGAI PEDAGANG' : 'DAFTAR';
                    btnSubmit.disabled = false;
                } else {
                    successBox.innerText = data.message;
                    successBox.classList.remove('d-none');
                    
                    setTimeout(() => { 
                        window.location.href = data.redirect_url || '/api/auth/view/verify-otp'; 
                    }, 1200);
                }
            })
            .catch(err => {
                alertBox.innerText = "Terjadi kesalahan sistem.";
                alertBox.classList.remove('d-none');
                btnSubmit.innerHTML = registerMode === 'pedagang' ? 'DAFTAR SEBAGAI PEDAGANG' : 'DAFTAR';
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
