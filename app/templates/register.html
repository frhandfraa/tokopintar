<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - TokoPintar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #03AC0E; }
        body { font-family: 'Open Sans', sans-serif; background-color: #F7F7F7; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .btn-tokped { background-color: var(--primary-color); color: white; font-weight: 700; width: 100%; padding: 12px; border-radius: 8px; border: none; }
        .btn-tokped:hover { background-color: #02960C; color: white; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h3 class="fw-bold text-center mb-4">Daftar Akun Baru</h3>
        <div id="alert-box" class="alert alert-danger d-none"></div>
        <div id="success-box" class="alert alert-success d-none"></div>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-tokped mb-3">Daftar</button>
            <p class="text-center text-muted" style="font-size: 0.9rem;">Sudah punya akun? <a href="/api/auth/view/login" class="text-success fw-bold text-decoration-none">Masuk</a></p>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');
            const successBox = document.getElementById('success-box');

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alertBox.innerText = data.error;
                    alertBox.classList.remove('d-none');
                    successBox.classList.add('d-none');
                } else {
                    successBox.innerText = data.message;
                    successBox.classList.remove('d-none');
                    alertBox.classList.add('d-none');
                    setTimeout(() => { window.location.href = '/api/auth/view/login'; }, 1500);
                }
            });
        });
    </script>
</body>
</html>
