<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #03AC0E; }
        body { font-family: 'Open Sans', sans-serif; background-color: #F7F7F7; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .error-box { text-align: center; background: white; padding: 50px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 500px; }
        .error-code { font-size: 6rem; font-weight: 700; color: var(--primary-color); line-height: 1; margin-bottom: 10px; }
        .btn-home { background-color: var(--primary-color); color: white; font-weight: 700; padding: 12px 30px; border-radius: 8px; border: none; text-decoration: none; transition: 0.2s; }
        .btn-home:hover { background-color: #02960C; color: white; }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <h3 class="fw-bold mb-3">Ups! Halaman Tidak Ditemukan</h3>
        <p class="text-muted mb-4">Sepertinya Anda tersesat. Halaman yang Anda cari mungkin sudah dihapus atau URL-nya salah ketik.</p>
        <a href="/api/products/view" class="btn-home"><i class="bi bi-house-door me-2"></i> Kembali ke Beranda</a>
    </div>
</body>
</html>
