<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoPintar - Belanja Lebih Cerdas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #4f46e5; --primary-hover: #4338ca; --bg-color: #f8fafc; --text-dark: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); }
        .navbar-custom { background-color: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 15px 0; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; color: var(--primary-color) !important; display: flex; align-items: center; gap: 10px; }
        .search-bar { border-radius: 50px; border: 1px solid #e2e8f0; padding: 10px 20px; width: 100%; max-width: 400px; transition: all 0.3s; }
        .search-bar:focus { box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); border-color: var(--primary-color); outline: none; }
        .product-card { border: none; border-radius: 16px; background: #ffffff; transition: all 0.3s ease; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); height: 100%; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0, 0, 0, 0.08); }
        .product-img { height: 180px; object-fit: cover; width: 100%; background-color: #e2e8f0; }
        .product-title { font-weight: 600; font-size: 1rem; color: var(--text-dark); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-price { font-weight: 700; font-size: 1.15rem; color: var(--primary-color); }
        .btn-detail { background-color: var(--primary-color); color: white; border-radius: 10px; font-weight: 500; padding: 10px; transition: all 0.2s; border: none; }
        .btn-detail:hover { background-color: var(--primary-hover); color: white; }
        .badge-rating { background-color: #fef08a; color: #854d0e; font-weight: 600; padding: 5px 10px; border-radius: 8px; }
        
        /* Tambahan CSS untuk Section AI */
        .ai-section { border: 2px dashed #c7d2fe; background: linear-gradient(145deg, #ffffff, #f5f3ff); border-radius: 16px; padding: 20px; }
        .ai-card { border: 1px solid #c7d2fe; background: #ffffff; }
        .ai-card:hover { box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top mb-5">
        <div class="container">
            <a class="navbar-brand" href="/api/products/view"><i class="bi bi-bag-heart-fill"></i> TokoPintar</a>
            <div class="d-flex align-items-center gap-3">
                <!-- Tambahan ID dan onkeypress untuk pencarian -->
                <input type="text" id="search-input" class="search-bar d-none d-md-block" placeholder="Cari produk impianmu..." onkeypress="handleSearch(event)">
                <a href="#" class="text-dark fs-4"><i class="bi bi-cart3"></i></a>
                <a href="#" class="text-dark fs-4"><i class="bi bi-person-circle"></i></a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- SECTION REKOMENDASI AI (BARU) -->
        <div class="ai-section mb-5 d-none" id="ai-section">
            <div class="d-flex align-items-center mb-3">
                <i class="bi bi-stars text-warning fs-4 me-2"></i>
                <h4 class="fw-bold mb-0">Rekomendasi Pintar AI</h4>
                <span class="badge bg-primary ms-3 rounded-pill px-3 py-2" style="font-size: 0.8rem;">Powered by TF-IDF</span>
            </div>
            <div class="row g-3" id="ai-recommendation-list">
                <!-- Produk AI akan diload via JavaScript di sini -->
            </div>
        </div>

        <!-- KATALOG PRODUK -->
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="fw-bold mb-1">Jelajahi Produk</h2>
                <p class="text-muted mb-0">Temukan produk terbaik dengan harga bersahabat.</p>
            </div>
        </div>

        <div class="row g-4" id="product-list">
            <div class="col-12 text-center py-5" id="loading">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 text-muted">Memuat produk terbaik...</p>
            </div>
        </div>
    </div>

    <script>
        // FUNGSI PENCARIAN (BARU)
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('search-input').value;
                if (query.trim() !== "") {
                    // Pastikan endpoint search ini sesuai dengan route di Python Anda
                    window.location.href = `/api/products/view?search=${encodeURIComponent(query)}`;
                }
            }
        }

        // 1. FETCH PRODUK KATALOG BIASA
        fetch('/api/products?per_page=24')
            .then(res => {
                if(!res.ok) throw new Error("Gagal mengambil data");
                return res.json();
            })
            .then(data => {
                const list = document.getElementById('product-list');
                document.getElementById('loading').style.display = 'none';
                
                data.data.forEach(product => {
                    const price = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(product.price);
                    const kategoriKunci = product.category.split('|')[0].replace('_', ' ');
                    
                    const imageUrl = `https://picsum.photos/seed/${product.id}/400/300`;
                    
                    list.innerHTML += `
                        <div class="col-md-4 col-lg-3">
                            <div class="card product-card">
                                <img src="${imageUrl}" class="product-img" alt="${product.name}" loading="lazy">
                                <div class="card-body d-flex flex-column p-4">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="badge bg-light text-secondary border text-truncate" style="max-width: 120px;">${kategoriKunci}</span>
                                        <span class="badge-rating"><i class="bi bi-star-fill text-warning"></i> ${product.rating}</span>
                                    </div>
                                    <h5 class="product-title mb-3" title="${product.name}">${product.name}</h5>
                                    
                                    <div class="mt-auto">
                                        <div class="product-price mb-3">${price}</div>
                                        <a href="/api/products/view/${product.id}" class="btn btn-detail w-100">
                                            Lihat Detail <i class="bi bi-arrow-right ms-1"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = `<div class="alert alert-danger">Gagal memuat produk. Pastikan server berjalan.</div>`;
            });

        // 2. FETCH REKOMENDASI AI (BARU)
        // PENTING: Sesuaikan URL '/api/recommendations/popular' dengan endpoint AI di Python Anda
        fetch('/api/recommendations/popular?k=4') 
            .then(res => res.json())
            .then(data => {
                // Jika data kosong, section tidak ditampilkan
                if (!data || !data.data || data.data.length === 0) return;

                document.getElementById('ai-section').classList.remove('d-none');
                const aiList = document.getElementById('ai-recommendation-list');

                data.data.forEach(product => {
                    const price = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(product.price);
                    
                    aiList.innerHTML += `
                        <div class="col-md-3 col-6">
                            <div class="card product-card ai-card">
                                <img src="https://picsum.photos/seed/${product.id}/300/200" class="product-img" style="height: 140px;">
                                <div class="card-body p-3">
                                    <h6 class="text-truncate fw-bold" title="${product.name}">${product.name}</h6>
                                    <p class="product-price mb-2" style="font-size: 1rem;">${price}</p>
                                    <a href="/api/products/view/${product.id}" class="btn btn-sm btn-outline-primary w-100" style="border-radius: 8px;">Cek Produk</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => console.log("Info: Endpoint AI belum siap atau sedang offline."));
    </script>
</body>
</html>
